<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank You | House of Vacation</title>
<meta name="description" content="Thank you for your enquiry. The House of Vacation team will respond within one business day.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://houseofvacation.com/thank-you/">
<style>
  :root{--ink:#141c25;--ink2:#4a5867;--line:#dde4ea;--bg:#f6f8fa;--card:#fff;--accent:#1f5f8b;--good:#1f7a4d}
  @media(prefers-color-scheme:dark){:root{--ink:#e8edf2;--ink2:#b3c0cc;--line:#2c3841;--bg:#0e141a;--card:#161e26;--accent:#6fadd6;--good:#79be9a}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--bg);color:var(--ink);padding:24px;line-height:1.6;
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .card{max-width:600px;width:100%;background:var(--card);border:1px solid var(--line);
        border-radius:6px;padding:44px 34px;text-align:center;
        box-shadow:0 10px 30px -20px rgba(20,28,37,.45)}
  .tick{width:60px;height:60px;border-radius:50%;background:var(--good);color:#fff;
        display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 20px}
  h1{margin:0 0 12px;font-size:1.7rem;letter-spacing:-.02em;text-wrap:balance}
  p{color:var(--ink2);margin:0 0 12px}
  .meta{font-size:.92rem;margin-bottom:28px}
  .links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:26px}
  .links a{padding:9px 15px;border:1px solid var(--line);border-radius:4px;text-decoration:none;
           color:var(--ink);font-size:.88rem;transition:.15s}
  .links a:hover,.links a:focus-visible{border-color:var(--accent);color:var(--accent)}
  .home{display:inline-block;padding:12px 28px;background:var(--accent);color:#fff;
        text-decoration:none;border-radius:4px;font-weight:600}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .foot{margin-top:30px;padding-top:20px;border-top:1px solid var(--line);font-size:.87rem;color:var(--ink2)}
  .foot a{color:var(--accent)}
</style>
</head>
<body>
  <main class="card">
    <div class="tick" aria-hidden="true">&#10003;</div>
    <h1>Thank you &mdash; we&rsquo;ve got your enquiry</h1>
    <p>Our MICE team will review your requirements and get back to you.</p>
    <p class="meta"><strong>We typically respond within one business day.</strong></p>

    <nav class="links" aria-label="Explore our services">
      <a href="/our-services/">Our Services</a>
      <a href="/mice-event/">MICE Events</a>
      <a href="/incentive/">Incentive Travel</a>
      <a href="/about-company/">About Us</a>
      <a href="/blog/">Blog</a>
    </nav>

    <a class="home" href="/">Back to homepage</a>

    <div class="foot">
      Need to reach us sooner?<br>
      <a href="tel:+919220470800">+91&nbsp;92204&nbsp;70800</a> &nbsp;&middot;&nbsp;
      <a href="mailto:mice@houseofvacation.com">mice@houseofvacation.com</a>
    </div>
  </main>
</body>
</html>
